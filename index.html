<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#747861">
  <meta name="description" content="An interactive atlas of domestic spaces: entering, gathering, and feeding.">
  <title>Where Home Happens</title>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>
  <!-- 开场动画：没有 JavaScript 时不会遮挡正文。 -->
  <section
    id="landing"
    class="landing"
    aria-label="Where Home Happens introduction"
    hidden
  >
    <p class="landing-title" aria-label="WHERE HOME HAPPENS">
      WHERE HOME HAPPENS
    </p>
    <button class="landing-skip" type="button">
      SKIP INTRO / 跳过开场 ↗
    </button>
  </section>

  <a class="skip-link" href="#main">Skip to archive</a>

  <div class="app-shell" id="app">
    <header class="masthead">
      <button
        class="wordmark"
        id="home-button"
        aria-label="Reset archive"
      >
        WHH<span>®</span>
      </button>

      <span class="masthead-subtitle" data-i18n="masthead">
        STUDY OF DOMESTIC LIFE
      </span>
    </header>

    <main id="main">
      <div class="archive-toolbar">
        <div
          class="filters"
          role="group"
          aria-label="Filter chapters"
        >
          <button
            class="filter active"
            data-filter="all"
            aria-pressed="true"
          >
            <span data-i18n="all">ALL SPACES</span><sup>06</sup>
          </button>

          <button
            class="filter"
            data-filter="entering"
            aria-pressed="false"
          >
            <span class="filter-number">01</span>
            <span data-i18n="entering">ENTERING</span>
          </button>

          <button
            class="filter"
            data-filter="gathering"
            aria-pressed="false"
          >
            <span class="filter-number">02</span>
            <span data-i18n="gathering">GATHERING</span>
          </button>

          <button
            class="filter"
            data-filter="feeding"
            aria-pressed="false"
          >
            <span class="filter-number">03</span>
            <span data-i18n="feeding">FEEDING</span>
          </button>
        </div>

        <span id="result-count" class="micro">06 / 06</span>
      </div>

      <section
        class="viewport"
        id="viewport"
        aria-label="Domestic space archive"
      >
        <div class="artboard" id="artboard">
          <div class="atlas-intro">
            <h1>Where home<br><span>happens.</span></h1>
            <span class="intro-rule" aria-hidden="true"></span>
          </div>

          <!-- 六个案例由 script.js 生成。 -->
          <div id="case-collection"></div>

          <span
            class="artboard-note micro"
            data-i18n="diagramNote"
          >
            NOT TO SCALE
          </span>
        </div>

        <span class="edge-note micro" aria-hidden="true">
          A HOUSE IS A STRUCTURE. A HOME IS A PRACTICE.
        </span>
      </section>

      <div class="viewport-controls" id="viewport-controls">
        <span class="micro" data-i18n="dragHint">
          DRAG TO WANDER · SELECT TO READ
        </span>

        <div class="zoom-group">
          <label for="zoom" class="micro" data-i18n="scale">
            SCALE
          </label>

          <input
            id="zoom"
            type="range"
            min="75"
            max="190"
            value="100"
            step="1"
            aria-label="Archive zoom"
          >

          <output
            id="zoom-value"
            for="zoom"
            class="micro"
          >
            100%
          </output>

          <button
            id="fit-button"
            class="text-button"
            data-i18n="reset"
          >
            RESET ↺
          </button>
        </div>
      </div>
    </main>

    <footer class="colophon">
      <span class="footer-title">WHERE HOME HAPPENS</span>

      <button
        class="text-button"
        id="sources-button"
        data-i18n="sources"
      >
        SOURCES & NOTES ↗
      </button>
    </footer>
  </div>

  <dialog
    id="reader-dialog"
    class="reader-dialog"
    aria-labelledby="reader-title"
  >
    <div id="reader-content"></div>
  </dialog>

  <dialog
    id="editorial-dialog"
    class="editorial-dialog"
    aria-labelledby="editorial-title"
  >
    <div class="dialog-bar">
      <span class="micro">WHH / SOURCES & NOTES</span>

      <button
        class="close-button"
        data-close="editorial-dialog"
        aria-label="Close"
      >
        ×
      </button>
    </div>

    <div id="editorial-content"></div>
  </dialog>

  <p
    id="status"
    class="sr-only"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  ></p>

  <noscript>
    <p class="noscript-note">
      Please enable JavaScript to explore the archive.
      请启用 JavaScript 浏览互动档案。
    </p>
  </noscript>
</body>
</html>
